# Dependabot-Konfiguration — AUD-2026-0002 F-025 (ATC-STD-203 Security)
version: 2
updates:
  - package-ecosystem: pip
    directory: "modules/atc-genesis-engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "modules/atc-genesis-engine/engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
