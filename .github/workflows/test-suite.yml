name: ATC Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt check
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: npm install + test/build (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            (cd "$d" && npm install --no-audit --no-fund --silent)
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/")
          exit "$FAIL"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: pytest ueber alle Requirements-Module (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if ! (cd "$d" && grep -rql --include="*.py" "def test_" .); then
              echo "SKIP $d: keine Tests vorhanden"; continue
            fi
            echo "=== pytest in $d"
            (cd "$d" && pip install -q -r requirements.txt pytest && python -m pytest -q --no-header) || { echo "pytest FAILED in $d"; FAIL=1; }
          done < <(find . -name requirements.txt -not -path "*/archive/*")
          exit "$FAIL"

  evidence:
    needs: [rust-workspace, npm-tests, pytest]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Evidence binding and immutable artifact
        run: |
          set -euo pipefail
          mkdir -p evidence
          git ls-tree -r --full-tree "$GITHUB_SHA" > evidence/source-tree.txt
          python3 - <<'PY'
          import datetime, hashlib, os, re
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          wf = os.environ.get("GITHUB_WORKFLOW", "ATC Test Suite")
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          source_tree_sha256 = hashlib.sha256(open("evidence/source-tree.txt", "rb").read()).hexdigest()
          p = ".atc/evidence/evidence.yaml"
          if not os.path.exists(p):
              raise SystemExit(f"missing evidence file: {p}")
          text = open(p, encoding="utf-8").read()
          text = re.sub(r"(?m)^bound_commit: [^\n]*", "bound_commit: " + sha, text)
          text = re.sub(r"(?m)^generated: [^\n]*", 'generated: "' + ts[:10] + '"', text)
          text = re.sub(r"(?m)^generated_by: [^\n]*", 'generated_by: "ATC Test Suite exact-commit evidence"', text)
          text = re.sub(r"(?m)^(tests:\n  status:) [^\n]*", lambda m: m.group(1) + " pass_with_evidence", text)
          text = re.sub(r"(?m)^  evidence: [^\n]*\n?", "", text)
          block = (
              "test_run:\n"
              "  workflow: " + wf + "\n"
              "  run_id: " + rid + "\n"
              "  commit: " + sha + "\n"
              "  timestamp: " + ts + "\n"
              "  result: PASS\n"
              "  runner: github-actions\n"
              "  jobs: rust-workspace=success,npm-tests=success,pytest=success\n"
              "  source_tree_file: source-tree.txt\n"
              "  source_tree_sha256: " + source_tree_sha256 + "\n"
          )
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", text):
              text = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", block, text)
          else:
              text = text.rstrip() + "\n" + block
          open(p, "w", encoding="utf-8").write(text)
          PY
          cp .atc/evidence/evidence.yaml evidence/evidence.yaml
          sha256sum evidence/evidence.yaml > evidence/evidence.yaml.sha256
      - name: Upload immutable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: genesis-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Persist evidence
        run: |
          git config user.name "Genesis-Bot"
          git config user.email "genesis@a-townchain.org"
          git add .atc/evidence/evidence.yaml
          git commit -m "chore(evidence): bind exact test result [skip ci]" || echo "nothing to commit"
          git push
